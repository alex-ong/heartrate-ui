[project]
name = "pulsoid-scraper"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiohttp>=3.14.5",
    "bleak>=3.0.2",
    "chromedriver-autoinstaller~=0.6",
    "matplotlib~=3.9",
    "numpy>=1.26",
    "pillow>=10.3",
    "selenium~=4.21",
]

[dependency-groups]
dev = ["ruff>=0.14.0"]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
